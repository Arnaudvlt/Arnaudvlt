<title>Repérage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style id="app-css">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none !important}
button,input,select,textarea{font:inherit;color:inherit}

:root{
  color-scheme:light;
  --ground:#EDEEE8;
  --surface:#F9F9F6;
  --sunk:#E3E5DB;
  --ink:#191B16;
  --muted:#6B6F63;
  --line:#D7D9CD;
  --line-soft:#E3E5DA;
  --buy:#9E4620;
  --buy-soft:#F0DFD5;
  --task:#28575C;
  --task-soft:#D7E5E4;
  --flag:#7E6009;
  --flag-soft:#F1E6C4;
  --focus:#28575C;
  --shadow:0 1px 0 rgba(25,27,22,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121410;
    --surface:#1A1D16;
    --sunk:#23271E;
    --ink:#E9EBE2;
    --muted:#9AA090;
    --line:#2E332A;
    --line-soft:#242821;
    --buy:#E4996E;
    --buy-soft:#37231A;
    --task:#8AC5C7;
    --task-soft:#153230;
    --flag:#DEC26D;
    --flag-soft:#302713;
    --focus:#8AC5C7;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121410;
  --surface:#1A1D16;
  --sunk:#23271E;
  --ink:#E9EBE2;
  --muted:#9AA090;
  --line:#2E332A;
  --line-soft:#242821;
  --buy:#E4996E;
  --buy-soft:#37231A;
  --task:#8AC5C7;
  --task-soft:#153230;
  --flag:#DEC26D;
  --flag-soft:#302713;
  --focus:#8AC5C7;
  --shadow:none;
}

body{
  background:var(--ground);
  color:var(--ink);
  font-family:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:640px;margin:0 auto;padding:22px 16px 64px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---- entête ---- */
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.brand h1{
  font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;
  font-weight:700;font-size:27px;letter-spacing:-.02em;margin:0;
  text-wrap:balance;
}
.tagline{
  margin:0;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
}

/* ---- capture ---- */
.capture{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:var(--shadow)}
.capture input[type="text"]{
  width:100%;border:0;background:transparent;padding:6px 4px 8px;
  font-size:16.5px;line-height:1.35;
}
.capture input[type="text"]::placeholder{color:var(--muted)}
.capture input[type="text"]:focus{outline:none}
.caprow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line-soft);padding-top:9px}
.seg{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--muted);
}
.seg[aria-pressed="true"][data-kind="buy"]{background:var(--buy-soft);border-color:transparent;color:var(--buy);font-weight:500}
.seg[aria-pressed="true"][data-kind="do"]{background:var(--task-soft);border-color:transparent;color:var(--task);font-weight:500}
.ghost{
  background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
}
.ghost:hover{border-color:var(--muted);color:var(--ink)}
.add{
  margin-left:auto;background:var(--ink);color:var(--ground);border:0;border-radius:999px;
  padding:7px 16px;cursor:pointer;font-weight:600;font-size:14px;
}
.add:disabled{background:var(--sunk);color:var(--muted);cursor:default}

/* ---- compteurs ---- */
.stats{display:flex;gap:0;margin:14px 0 4px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stat{flex:1;padding:9px 10px;border-right:1px solid var(--line-soft)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat.buy b{color:var(--buy)}
.stat.task b{color:var(--task)}

.notice{
  margin-top:12px;padding:9px 12px;border-radius:8px;background:var(--flag-soft);color:var(--flag);
  font-size:13.5px;display:flex;gap:8px;align-items:center;justify-content:space-between;
}
.notice button{background:transparent;border:0;text-decoration:underline;cursor:pointer;color:inherit;font-size:13px;padding:0}

/* ---- filtres ---- */
.tabs{display:flex;gap:14px;margin:18px 0 2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{
  background:transparent;border:0;border-bottom:2px solid transparent;padding:0 0 8px;cursor:pointer;
  font-size:14px;color:var(--muted);white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.searchwrap{margin-top:12px}
.searchwrap input{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:8px 11px;font-size:14.5px}
.searchwrap input:focus{outline:none;border-color:var(--focus);background:var(--surface)}

/* ---- liste ---- */
.list{margin-top:6px}
.item{display:flex;gap:11px;padding:14px 2px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.item:last-child{border-bottom:0}
.item.is-done{opacity:.5}
.tick{
  flex:0 0 auto;width:21px;height:21px;margin-top:2px;border-radius:6px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;
}
.tick svg{width:12px;height:12px;opacity:0;stroke:var(--ground)}
.item.is-done .tick{background:var(--muted);border-color:var(--muted)}
.item.is-done .tick svg{opacity:1}
.item.k-buy .tick{border-color:var(--buy)}
.item.k-do .tick{border-color:var(--task)}
.body{flex:1 1 auto;min-width:0}
.title{font-size:16.5px;font-weight:500;line-height:1.3;word-break:break-word}
.item.is-done .title{text-decoration:line-through}
.title.empty{color:var(--muted);font-style:italic;font-weight:400}
.why{margin:3px 0 0;font-size:14px;color:var(--muted);line-height:1.4;word-break:break-word}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap;
}
.chip.k-buy{background:var(--buy-soft);color:var(--buy)}
.chip.k-do{background:var(--task-soft);color:var(--task)}
.chip.flag{background:var(--flag-soft);color:var(--flag)}
.chip.price{font-variant-numeric:tabular-nums}
a.chip{text-decoration:none;border:1px solid var(--line)}
a.chip:hover{color:var(--ink);border-color:var(--muted)}
.rowedit{flex:0 0 auto;background:transparent;border:0;cursor:pointer;color:var(--muted);padding:2px 4px;font-size:18px;line-height:1}
.rowedit:hover{color:var(--ink)}

/* ---- édition ---- */
.editor{padding:4px 2px 18px;border-bottom:1px solid var(--line-soft);display:grid;gap:9px}
.field{display:grid;gap:4px}
.field label{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:15px;
}
.field textarea{resize:vertical;min-height:52px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--focus)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.editbar{display:flex;gap:8px;align-items:center;margin-top:2px}
.editbar .add{margin-left:0}
.danger{margin-left:auto;background:transparent;border:0;color:var(--buy);cursor:pointer;font-size:13px;text-decoration:underline;padding:0}

.empty-state{padding:34px 6px;color:var(--muted);font-size:15px;line-height:1.6}
.empty-state b{color:var(--ink);font-weight:600}
.empty-state code{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:4px}

/* ---- pied ---- */
.foot{margin-top:26px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:12px}
.status{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.dot.ok{background:var(--task)}
.dot.warn{background:var(--flag)}
details.help{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
details.help summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none}
details.help summary::-webkit-details-marker{display:none}
details.help summary::before{content:"+ ";color:var(--muted)}
details.help[open] summary::before{content:"– "}
details.help ol{margin:10px 0 0;padding-left:19px;font-size:14px;line-height:1.65;color:var(--muted)}
details.help li{margin-bottom:5px}
details.help strong{color:var(--ink);font-weight:600}
.urlbox{display:flex;gap:6px;margin-top:9px;align-items:center}
.urlbox input{flex:1;min-width:0;font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
</style>

<div id="app"></div>

<script type="application/json" id="app-state">{"v":1,"items":[],"updated":0}</script>

<script id="app-js">
(function(){
"use strict";

var KEY = "reperage.v1";
var FONT_URL = "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap";

var BUY_WORDS = ["acheter","achete","achète","commander","commande","racheter","reprendre","offrir","achat","buy","commandes"];
var DO_WORDS  = ["faire","appeler","envoyer","relancer","reserver","réserver","ecrire","écrire","finir","terminer","preparer","préparer","ranger","trier","rdv","mail","tache","tâche","todo","penser","rappeler","demander","checker","verifier","vérifier"];

/* ------------------------------------------------ état */
var state;
try { state = JSON.parse(document.getElementById("app-state").textContent); } catch(e){ state = null; }
if(!state || !Object.prototype.toString.call(state.items).match(/Array/)) state = {v:1, items:[], updated:0};

var artifactApi = null, downloadsApi = null;
var mode = "pending", touched = false, editingId = null;
var filter = "all", query = "", kindSel = "buy", kindLocked = false;
var saveTimer = null, status = {text:"chargement…", tone:""};

var ready = (window.claude && typeof window.claude.use === "function")
  ? window.claude.use("artifact").catch(function(){ return null; })
  : Promise.resolve(null);

ready.then(function(ns){
  artifactApi = ns;
  mode = ns ? "cloud" : "local";
  if(!ns && !touched){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var s = JSON.parse(raw);
        if(s && s.items && (s.updated||0) > (state.updated||0)) state = s;
      }
    }catch(e){}
  }
  setStatus(ns ? "synchronisé" : "sauvegardé sur cet appareil", ns ? "ok" : "warn");
  render();
});

if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("downloads").then(function(ns){ downloadsApi = ns; render(); }).catch(function(){});
}

/* ------------------------------------------------ outils */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function elt(tag, cls, txt){ var n = document.createElement(tag); if(cls) n.className = cls; if(txt != null) n.textContent = txt; return n; }
function money(n){ return (Math.round(n*100)/100).toLocaleString("fr-FR") + " €"; }

function platform(url){
  try{
    var h = new URL(url).hostname.replace(/^www\./,"");
    if(/tiktok/.test(h)) return "tiktok";
    if(/instagram/.test(h)) return "instagram";
    if(/youtu/.test(h)) return "youtube";
    if(/pinterest|pin\.it/.test(h)) return "pinterest";
    if(/amazon|amzn/.test(h)) return "amazon";
    if(/vinted/.test(h)) return "vinted";
    if(/twitter|x\.com/.test(h)) return "x";
    if(/facebook|fb\.watch/.test(h)) return "facebook";
    return h.split(".")[0];
  }catch(e){ return "lien"; }
}

function parse(text){
  var t = String(text || "").trim();
  var out = {kind:null, title:"", why:"", tag:"", url:"", price:null, flag:false};

  var m = t.match(/(https?:\/\/[^\s]+)/i);
  if(m){ out.url = m[1].replace(/[),.;]+$/,""); t = t.replace(m[1]," ").trim(); out.kind = "buy"; }

  var tg = t.match(/(^|\s)#([A-Za-z0-9À-ſ_\-]+)/);
  if(tg){ out.tag = tg[2]; t = t.replace(tg[0]," ").trim(); }

  var pr = t.match(/(\d+(?:[.,]\d+)?)\s*(?:€|eur\b|euros?\b)/i) || t.match(/€\s*(\d+(?:[.,]\d+)?)/);
  if(pr){ out.price = parseFloat(pr[1].replace(",",".")); t = t.replace(pr[0]," ").trim(); }

  if(/(!{1,3}|\burgent\b)\s*$/i.test(t)){ out.flag = true; t = t.replace(/(!{1,3}|\burgent\b)\s*$/i,"").trim(); }

  var cut = t.split(/\s+(?:parce\s+qu[e’']|parcequ[e’']|pcq|car)\s*/i);
  if(cut.length > 1){ t = cut[0].trim(); out.why = cut.slice(1).join(" ").trim(); }
  else {
    var dash = t.split(/\s+[—–]\s+/);
    if(dash.length > 1){ t = dash[0].trim(); out.why = dash.slice(1).join(" — ").trim(); }
  }

  var words = t.split(/\s+/).filter(Boolean);
  if(words.length > 1 && words[0].toLowerCase() === "à") words.shift();
  var first = (words[0] || "").toLowerCase().replace(/[:,]+$/,"");
  if(BUY_WORDS.indexOf(first) >= 0 && words.length > 1){
    out.kind = "buy"; words.shift();
    if(words.length > 1 && /^(des|du|de|d\u2019|d\'|un|une|le|la|les)$/i.test(words[0])) words.shift();
    if(words.length > 1 && /^(la)$/i.test(words[0])) words.shift();
  } else if(DO_WORDS.indexOf(first) >= 0){
    out.kind = "do";
    if(/^(todo|tache|t\u00e2che|faire)$/i.test(first) && words.length > 1 && /[:,]$/.test(words[0])) words.shift();
  }
  t = words.join(" ");

  if(!out.kind) out.kind = "do";
  out.title = t.replace(/\s{2,}/g," ").trim();
  return out;
}

/* ------------------------------------------------ persistance */
function scheduleSave(){
  touched = true;
  clearTimeout(saveTimer);
  setStatus("modifié…", "");
  saveTimer = setTimeout(flush, 1100);
}

function flush(){
  if(editingId !== null){ saveTimer = setTimeout(flush, 1500); return; }
  state.updated = Date.now();
  setStatus("enregistrement…", "");
  renderStatus();
  ready.then(function(ns){
    if(ns) return ns.publish(buildDoc(state)).then(function(){ setStatus("synchronisé","ok"); renderStatus(); });
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
    setStatus("sauvegardé sur cet appareil","warn");
    renderStatus();
  }).catch(function(err){
    var code = err && err.code;
    setStatus(code === "conflict" ? "une version plus récente existe" : "non enregistré", "warn");
    renderStatus();
  });
}

function buildDoc(st){
  var css = document.getElementById("app-css").textContent;
  var js  = document.getElementById("app-js").textContent;
  var json = JSON.stringify(st).replace(/</g, "\\u003c");
  return '<!doctype html><html lang="fr"><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width, initial-scale=1">'
    + '<title>Repérage<\/title>'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">'
    + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
    + '<link rel="stylesheet" href="' + FONT_URL + '">'
    + '<style id="app-css">' + css + '<\/style><\/head><body><div id="app"><\/div>'
    + '<script type="application/json" id="app-state">' + json + '<\/script>'
    + '<script id="app-js">' + js + '<\/script><\/body><\/html>';
}

function setStatus(text, tone){ status = {text:text, tone:tone || ""}; }

/* ------------------------------------------------ mutations */
function addItem(p){
  var it = {
    id: uid(), kind: p.kind === "buy" ? "buy" : "do",
    title: p.title || "", why: p.why || "", tag: p.tag || "", url: p.url || "",
    price: (p.price == null ? null : p.price), flag: !!p.flag,
    done: false, created: Date.now(), doneAt: null
  };
  state.items.unshift(it);
  scheduleSave();
  return it;
}
function find(id){ for(var i=0;i<state.items.length;i++){ if(state.items[i].id === id) return state.items[i]; } return null; }
function removeItem(id){ state.items = state.items.filter(function(x){ return x.id !== id; }); scheduleSave(); }

/* ------------------------------------------------ capture par URL */
function ingestParams(){
  var sp;
  try{ sp = new URLSearchParams(location.search); }catch(e){ return false; }
  var link  = sp.get("add") || sp.get("url") || sp.get("u") || "";
  var text  = sp.get("text") || sp.get("title") || sp.get("name") || "";
  if(!link && !text) return false;
  var p = parse((text + " " + link).trim());
  if(link && !p.url) p.url = link;
  if(p.url) p.kind = "buy";
  addItem(p);
  try{ history.replaceState({}, "", location.pathname); }catch(e){}
  return true;
}

/* ------------------------------------------------ vue */
var app = document.getElementById("app");

function mount(){
  app.innerHTML = ""
    + '<div class="brand"><h1>Repérage<\/h1><p class="tagline">vu · à acheter · à faire<\/p><\/div>'
    + '<form class="capture" id="f-cap">'
    +   '<input type="text" id="i-cap" autocomplete="off" placeholder="Colle un lien de vidéo, ou écris ce que tu dois faire…" aria-label="Capture rapide">'
    +   '<div class="caprow">'
    +     '<button type="button" class="seg" data-kind="buy" aria-pressed="true">À acheter<\/button>'
    +     '<button type="button" class="seg" data-kind="do" aria-pressed="false">À faire<\/button>'
    +     '<button type="button" class="ghost" id="b-paste">Coller<\/button>'
    +     '<button type="submit" class="add" id="b-add" disabled>Ajouter<\/button>'
    +   '<\/div>'
    + '<\/form>'
    + '<div id="slot-stats"><\/div>'
    + '<div class="tabs" role="tablist">'
    +   '<button class="tab" data-f="all" role="tab" aria-selected="true">Tout<\/button>'
    +   '<button class="tab" data-f="buy" role="tab" aria-selected="false">À acheter<\/button>'
    +   '<button class="tab" data-f="do" role="tab" aria-selected="false">À faire<\/button>'
    +   '<button class="tab" data-f="done" role="tab" aria-selected="false">Fait<\/button>'
    + '<\/div>'
    + '<div class="searchwrap"><input type="search" id="i-search" placeholder="Rechercher…" aria-label="Rechercher"><\/div>'
    + '<div class="list" id="slot-list"><\/div>'
    + '<div class="foot">'
    +   '<div class="status" id="slot-status"><\/div>'
    +   '<details class="help"><summary>Capturer depuis TikTok, Insta ou YouTube<\/summary>'
    +     '<ol>'
    +       '<li>Sur la vidéo : <strong>Partager → Copier le lien<\/strong>.<\/li>'
    +       '<li>Ouvre cette page (ajoute-la à ton écran d’accueil, elle s’ouvre comme une appli) et appuie sur <strong>Coller<\/strong> puis <strong>Ajouter<\/strong>.<\/li>'
    +       '<li>Encore plus rapide : un <strong>Raccourci iOS<\/strong> « Recevoir des URL → Ouvrir l’URL » avec l’adresse ci-dessous, et la vidéo s’ajoute toute seule depuis le menu Partager.<\/li>'
    +       '<li>Astuce d’écriture : <strong>acheter crème Ordinary 12€ #peau parce que la mienne est finie !<\/strong> → tout est rangé automatiquement (type, prix, tag, raison, urgence).<\/li>'
    +     '<\/ol>'
    +     '<div class="urlbox"><input type="text" id="i-share" readonly aria-label="Adresse de capture"><button type="button" class="ghost" id="b-copy">Copier<\/button><\/div>'
    +   '<\/details>'
    + '<\/div>';

  document.getElementById("f-cap").addEventListener("submit", onSubmit);
  var cap = document.getElementById("i-cap");
  cap.addEventListener("input", onCapInput);
  document.getElementById("b-paste").addEventListener("click", onPaste);
  document.getElementById("b-copy").addEventListener("click", onCopy);
  document.getElementById("i-search").addEventListener("input", function(e){ query = e.target.value.toLowerCase(); renderList(); });

  Array.prototype.forEach.call(app.querySelectorAll(".seg"), function(b){
    b.addEventListener("click", function(){ kindSel = b.getAttribute("data-kind"); kindLocked = true; syncSeg(); });
  });
  Array.prototype.forEach.call(app.querySelectorAll(".tab"), function(b){
    b.addEventListener("click", function(){
      filter = b.getAttribute("data-f");
      Array.prototype.forEach.call(app.querySelectorAll(".tab"), function(x){ x.setAttribute("aria-selected", String(x === b)); });
      renderList();
    });
  });

  var share = document.getElementById("i-share");
  try{ share.value = location.origin + location.pathname + "?add="; }catch(e){ share.value = "?add="; }
}

function syncSeg(){
  Array.prototype.forEach.call(app.querySelectorAll(".seg"), function(b){
    b.setAttribute("aria-pressed", String(b.getAttribute("data-kind") === kindSel));
  });
}

function onCapInput(e){
  var v = e.target.value;
  document.getElementById("b-add").disabled = !v.trim();
  if(!kindLocked){ kindSel = parse(v).kind; syncSeg(); }
  if(!v.trim()){ kindLocked = false; }
}

function onSubmit(e){
  e.preventDefault();
  var input = document.getElementById("i-cap");
  var v = input.value.trim();
  if(!v) return;
  var p = parse(v);
  p.kind = kindSel;
  addItem(p);
  input.value = "";
  document.getElementById("b-add").disabled = true;
  kindLocked = false; kindSel = "buy"; syncSeg();
  filter = (filter === "done") ? "all" : filter;
  Array.prototype.forEach.call(app.querySelectorAll(".tab"), function(x){ x.setAttribute("aria-selected", String(x.getAttribute("data-f") === filter)); });
  render();
  input.focus();
}

function onPaste(){
  if(!navigator.clipboard || !navigator.clipboard.readText){
    document.getElementById("i-cap").focus();
    return;
  }
  navigator.clipboard.readText().then(function(txt){
    if(!txt) { document.getElementById("i-cap").focus(); return; }
    var input = document.getElementById("i-cap");
    input.value = (input.value ? input.value + " " : "") + txt.trim();
    onCapInput({target:input});
    input.focus();
  }).catch(function(){ document.getElementById("i-cap").focus(); });
}

function onCopy(){
  var f = document.getElementById("i-share");
  f.select();
  var btn = document.getElementById("b-copy");
  var done = function(){ btn.textContent = "Copié"; setTimeout(function(){ btn.textContent = "Copier"; }, 1600); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(f.value).then(done).catch(function(){});
  } else { try{ document.execCommand("copy"); done(); }catch(e){} }
}

function visible(){
  var out = state.items.filter(function(it){
    if(filter === "done") return it.done;
    if(it.done) return false;
    if(filter === "buy") return it.kind === "buy";
    if(filter === "do")  return it.kind === "do";
    return true;
  });
  if(query){
    out = out.filter(function(it){
      return ((it.title||"") + " " + (it.why||"") + " " + (it.tag||"") + " " + (it.url||"")).toLowerCase().indexOf(query) >= 0;
    });
  }
  out.sort(function(a,b){
    if(filter === "done") return (b.doneAt||b.created) - (a.doneAt||a.created);
    var an = a.title ? 1 : 0, bn = b.title ? 1 : 0;
    if(an !== bn) return an - bn;
    if(!!b.flag !== !!a.flag) return (b.flag?1:0) - (a.flag?1:0);
    return b.created - a.created;
  });
  return out;
}

function renderStats(){
  var slot = document.getElementById("slot-stats");
  var open = state.items.filter(function(i){ return !i.done; });
  var buy  = open.filter(function(i){ return i.kind === "buy"; });
  var todo = open.filter(function(i){ return i.kind === "do"; });
  var sum  = buy.reduce(function(a,i){ return a + (i.price || 0); }, 0);
  var noname = open.filter(function(i){ return !i.title && i.url; });

  slot.innerHTML = ""
    + '<div class="stats">'
    +   '<div class="stat buy"><b>' + buy.length + '<\/b><span>à acheter<\/span><\/div>'
    +   '<div class="stat task"><b>' + todo.length + '<\/b><span>à faire<\/span><\/div>'
    +   '<div class="stat"><b>' + (sum ? money(sum) : "—") + '<\/b><span>budget repéré<\/span><\/div>'
    + '<\/div>';

  if(noname.length){
    var n = elt("div","notice");
    n.appendChild(elt("span", null, noname.length + (noname.length > 1 ? " liens capturés sans nom" : " lien capturé sans nom")));
    var b = elt("button", null, "Les nommer");
    b.addEventListener("click", function(){
      filter = "all"; query = ""; document.getElementById("i-search").value = "";
      Array.prototype.forEach.call(app.querySelectorAll(".tab"), function(x){ x.setAttribute("aria-selected", String(x.getAttribute("data-f") === "all")); });
      editingId = noname[0].id; renderList();
      var ed = app.querySelector(".editor input"); if(ed) ed.focus();
    });
    n.appendChild(b);
    slot.appendChild(n);
  }
}

function renderStatus(){
  var slot = document.getElementById("slot-status");
  if(!slot) return;
  slot.innerHTML = "";
  var d = elt("span", "dot " + (status.tone || ""));
  slot.appendChild(d);
  slot.appendChild(elt("span", null, status.text));
  var done = state.items.filter(function(i){ return i.done; }).length;
  if(done) slot.appendChild(elt("span", null, "· " + done + " fait" + (done > 1 ? "s" : "")));
  if(downloadsApi && state.items.length){
    var b = elt("button", "ghost", "Exporter");
    b.style.marginLeft = "auto";
    b.addEventListener("click", function(){
      downloadsApi.save({ filename: "reperage.json", data: JSON.stringify(state, null, 2) }).catch(function(){});
    });
    slot.appendChild(b);
  }
}

function itemNode(it){
  var wrap = elt("article", "item k-" + it.kind + (it.done ? " is-done" : ""));

  var tick = elt("button", "tick");
  tick.type = "button";
  tick.setAttribute("aria-pressed", String(!!it.done));
  tick.setAttribute("aria-label", it.done ? "Marquer comme non fait" : "Marquer comme fait");
  tick.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.6l3.4 3.4L13.5 4.4"/><\/svg>';
  tick.addEventListener("click", function(){
    it.done = !it.done; it.doneAt = it.done ? Date.now() : null;
    scheduleSave(); render();
  });
  wrap.appendChild(tick);

  var body = elt("div", "body");
  var t = elt("div", "title" + (it.title ? "" : " empty"), it.title || "Sans nom — qu’est-ce que c’était ?");
  body.appendChild(t);
  if(it.why) body.appendChild(elt("p", "why", it.why));

  var chips = elt("div", "chips");
  chips.appendChild(elt("span", "chip k-" + it.kind, it.kind === "buy" ? "achat" : "tâche"));
  if(it.flag) chips.appendChild(elt("span", "chip flag", "urgent"));
  if(it.price != null) chips.appendChild(elt("span", "chip price", money(it.price)));
  if(it.tag) chips.appendChild(elt("span", "chip", "#" + it.tag));
  if(it.url){
    var a = elt("a", "chip", platform(it.url) + " ↗");
    a.href = it.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    chips.appendChild(a);
  }
  body.appendChild(chips);
  wrap.appendChild(body);

  var ed = elt("button", "rowedit", "⋯");
  ed.type = "button";
  ed.setAttribute("aria-label", "Modifier");
  ed.addEventListener("click", function(){ editingId = (editingId === it.id ? null : it.id); renderList(); });
  wrap.appendChild(ed);

  return wrap;
}

function editorNode(it){
  var box = elt("div", "editor");
  box.innerHTML = ""
    + '<div class="field"><label for="e-title">Quoi<\/label><input id="e-title" type="text" placeholder="Nom du produit ou de la tâche"><\/div>'
    + '<div class="field"><label for="e-why">Pourquoi<\/label><textarea id="e-why" placeholder="vu dans la vidéo de… / il m’en faut une pour le taf"><\/textarea><\/div>'
    + '<div class="grid2">'
    +   '<div class="field"><label for="e-kind">Type<\/label><select id="e-kind"><option value="buy">À acheter<\/option><option value="do">À faire<\/option><\/select><\/div>'
    +   '<div class="field"><label for="e-price">Prix estimé (€)<\/label><input id="e-price" type="number" step="0.01" inputmode="decimal" placeholder=""><\/div>'
    + '<\/div>'
    + '<div class="grid2">'
    +   '<div class="field"><label for="e-tag">Contexte<\/label><input id="e-tag" type="text" placeholder="taf, maison, cadeau…"><\/div>'
    +   '<div class="field"><label for="e-flag">Priorité<\/label><select id="e-flag"><option value="0">Normale<\/option><option value="1">Urgent<\/option><\/select><\/div>'
    + '<\/div>'
    + '<div class="field"><label for="e-url">Source<\/label><input id="e-url" type="url" placeholder="https://…"><\/div>'
    + '<div class="editbar"><button type="button" class="add" id="e-save">Enregistrer<\/button><button type="button" class="ghost" id="e-cancel">Annuler<\/button><button type="button" class="danger" id="e-del">Supprimer<\/button><\/div>';

  box.querySelector("#e-title").value = it.title || "";
  box.querySelector("#e-why").value   = it.why || "";
  box.querySelector("#e-kind").value  = it.kind;
  box.querySelector("#e-price").value = it.price == null ? "" : it.price;
  box.querySelector("#e-tag").value   = it.tag || "";
  box.querySelector("#e-flag").value  = it.flag ? "1" : "0";
  box.querySelector("#e-url").value   = it.url || "";

  box.querySelector("#e-save").addEventListener("click", function(){
    it.title = box.querySelector("#e-title").value.trim();
    it.why   = box.querySelector("#e-why").value.trim();
    it.kind  = box.querySelector("#e-kind").value === "do" ? "do" : "buy";
    var pv   = parseFloat(String(box.querySelector("#e-price").value).replace(",","."));
    it.price = isNaN(pv) ? null : pv;
    it.tag   = box.querySelector("#e-tag").value.trim().replace(/^#/,"");
    it.flag  = box.querySelector("#e-flag").value === "1";
    it.url   = box.querySelector("#e-url").value.trim();
    editingId = null;
    scheduleSave(); render();
  });
  box.querySelector("#e-cancel").addEventListener("click", function(){ editingId = null; renderList(); });
  box.querySelector("#e-del").addEventListener("click", function(){
    editingId = null; removeItem(it.id); render();
  });
  return box;
}

function renderList(){
  var slot = document.getElementById("slot-list");
  slot.innerHTML = "";
  var rows = visible();
  if(!rows.length){
    var e = elt("div", "empty-state");
    e.innerHTML = state.items.length
      ? "Rien ici pour l’instant."
      : "<b>Commence par coller un lien.<\/b><br>Une vidéo TikTok, un Reel, un Short : le lien est gardé, tu mets le nom du produit quand tu veux.<br><br>Ou écris directement une tâche, par exemple <code>relancer le devis parce que je bloque dessus<\/code>.";
    slot.appendChild(e);
    return;
  }
  rows.forEach(function(it){
    slot.appendChild(itemNode(it));
    if(editingId === it.id) slot.appendChild(editorNode(it));
  });
}

function render(){ renderStats(); renderList(); renderStatus(); }

/* ------------------------------------------------ démarrage */
mount();
syncSeg();
var came = ingestParams();
render();
if(came){
  var first = state.items[0];
  if(first && !first.title){ editingId = first.id; renderList(); }
}
if(came || (location.search && location.search.length > 1)){
  var c = document.getElementById("i-cap"); if(c) c.focus();
}
})();
</script>
