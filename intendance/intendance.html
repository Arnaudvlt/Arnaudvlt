<style>
/* ---------------------------------------------------------------------------
   Système de design : jetons et anatomie de composants de shadcn/ui, écrits en
   CSS (c'est son mode de distribution : on copie le composant, on le possède).
   Base neutre zinc, primaire quasi-noire, destructive rouge, rayon 8 px.
--------------------------------------------------------------------------- */
:root{
  --background:0 0% 100%;        --foreground:240 10% 3.9%;
  --card:0 0% 100%;              --card-foreground:240 10% 3.9%;
  --sidebar:240 4.8% 95.9%;
  --muted:240 4.8% 95.9%;        --muted-foreground:240 3.8% 46.1%;
  --primary:240 5.9% 10%;        --primary-foreground:0 0% 98%;
  --secondary:240 4.8% 95.9%;    --secondary-foreground:240 5.9% 10%;
  --accent:240 4.8% 95.9%;       --accent-foreground:240 5.9% 10%;
  --destructive:0 72.2% 50.6%;   --destructive-fg:0 72.2% 42%;
  --warning:38 92% 40%;
  --border:240 5.9% 90%;         --input:240 5.9% 90%;   --ring:240 5.9% 10%;
  --radius:0.5rem;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --background:240 10% 3.9%;     --foreground:0 0% 98%;
    --card:240 10% 3.9%;           --card-foreground:0 0% 98%;
    --sidebar:240 5.9% 6.5%;
    --muted:240 3.7% 15.9%;        --muted-foreground:240 5% 64.9%;
    --primary:0 0% 98%;            --primary-foreground:240 5.9% 10%;
    --secondary:240 3.7% 15.9%;    --secondary-foreground:0 0% 98%;
    --accent:240 3.7% 15.9%;       --accent-foreground:0 0% 98%;
    --destructive:0 62.8% 40%;     --destructive-fg:0 80% 65%;
    --warning:38 92% 62%;
    --border:240 3.7% 15.9%;       --input:240 3.7% 15.9%;  --ring:240 4.9% 83.9%;
    --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .4);
    --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .6), 0 4px 6px -4px rgb(0 0 0 / .5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --background:240 10% 3.9%;     --foreground:0 0% 98%;
  --card:240 10% 3.9%;           --card-foreground:0 0% 98%;
  --sidebar:240 5.9% 6.5%;
  --muted:240 3.7% 15.9%;        --muted-foreground:240 5% 64.9%;
  --primary:0 0% 98%;            --primary-foreground:240 5.9% 10%;
  --secondary:240 3.7% 15.9%;    --secondary-foreground:0 0% 98%;
  --accent:240 3.7% 15.9%;       --accent-foreground:0 0% 98%;
  --destructive:0 62.8% 40%;     --destructive-fg:0 80% 65%;
  --warning:38 92% 62%;
  --border:240 3.7% 15.9%;       --input:240 3.7% 15.9%;  --ring:240 4.9% 83.9%;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .4);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / .6), 0 4px 6px -4px rgb(0 0 0 / .5);
  color-scheme:dark;
}

/* ------------------------------------------------------------------ socle */
*{box-sizing:border-box}
body{
  margin:0; background:hsl(var(--background)); color:hsl(var(--foreground));
  font:400 14px/1.5 Geist, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing:antialiased; font-feature-settings:"cv11";
  display:grid; grid-template-columns:220px minmax(0,1fr); min-height:100vh;
}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.01em; text-wrap:balance}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid hsl(var(--ring)); outline-offset:2px}
.mono{font-family:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums}
a{color:hsl(var(--foreground)); text-underline-offset:3px; text-decoration-color:hsl(var(--border))}
a:hover{text-decoration-color:currentColor}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important}}

/* --------------------------------------------------------------- sidebar */
.rail{
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:16px;
  padding:16px 12px; background:hsl(var(--sidebar)); border-right:1px solid hsl(var(--border));
}
.marque{display:flex; align-items:center; gap:9px; padding:4px 8px 6px}
.marque b{font-size:14px; font-weight:600; letter-spacing:-.01em}
.marque .mark{
  width:26px; height:26px; flex:none; display:grid; place-items:center; border-radius:7px;
  background:hsl(var(--primary)); color:hsl(var(--primary-foreground));
}
.marque .mark svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.rail nav{display:flex; flex-direction:column; gap:2px}
.onglet{
  display:flex; align-items:center; gap:9px; width:100%; height:34px; padding:0 9px;
  border:0; border-radius:calc(var(--radius) - 2px); background:none; text-align:left;
  font-size:14px; font-weight:500; color:hsl(var(--muted-foreground));
  transition:background-color .12s, color .12s;
}
.onglet svg{width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.onglet:hover{background:hsl(var(--accent)); color:hsl(var(--accent-foreground))}
.onglet[aria-current="true"]{background:hsl(var(--accent)); color:hsl(var(--accent-foreground)); font-weight:600}
.onglet .compte{
  margin-left:auto; font-size:11px; font-weight:500; line-height:18px; min-width:18px; padding:0 5px;
  border-radius:5px; background:hsl(var(--background)); border:1px solid hsl(var(--border));
  color:hsl(var(--muted-foreground)); text-align:center;
  font-family:"Geist Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;
}
.rail-pied{margin-top:auto; display:flex; flex-direction:column; gap:9px}
.sauv{font-size:12px; color:hsl(var(--muted-foreground)); display:flex; align-items:center; gap:7px; padding:0 9px; min-height:16px}
.sauv i{width:6px; height:6px; border-radius:50%; background:hsl(142 71% 45%); flex:none}
.sauv[data-etat="cours"] i{background:hsl(var(--warning))}
.sauv[data-etat="local"] i{background:hsl(var(--muted-foreground))}

/* ----------------------------------------------------------------- pages */
main{padding:28px 32px 80px; max-width:1200px; width:100%}
.tete{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:22px}
.tete h1{font-size:24px; line-height:1.2}
.tete p{margin:5px 0 0; color:hsl(var(--muted-foreground)); font-size:14px}
.tete .droite{margin-left:auto; display:flex; gap:8px; align-items:center}

/* ------------------------------------------------------------- commandes */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px; height:36px; padding:0 14px;
  border:1px solid hsl(var(--border)); border-radius:calc(var(--radius) - 2px);
  background:hsl(var(--background)); color:hsl(var(--foreground));
  font-size:14px; font-weight:500; white-space:nowrap; box-shadow:var(--shadow-sm);
  transition:background-color .12s, color .12s, border-color .12s;
}
.btn:hover{background:hsl(var(--accent)); color:hsl(var(--accent-foreground))}
.btn-plein{background:hsl(var(--primary)); border-color:hsl(var(--primary)); color:hsl(var(--primary-foreground))}
.btn-plein:hover{background:hsl(var(--primary)/.9); color:hsl(var(--primary-foreground))}
.btn-danger{color:hsl(var(--destructive-fg)); border-color:hsl(var(--destructive)/.4)}
.btn-danger:hover{background:hsl(var(--destructive)/.1); color:hsl(var(--destructive-fg))}
.btn-nu{
  display:inline-grid; place-items:center; width:28px; height:28px; border:0; background:none;
  border-radius:6px; color:hsl(var(--muted-foreground)); box-shadow:none; padding:0;
}
.btn-nu:hover{background:hsl(var(--accent)); color:hsl(var(--accent-foreground))}
.btn-nu.danger:hover{background:hsl(var(--destructive)/.1); color:hsl(var(--destructive-fg))}
.btn-nu svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.champ{
  height:36px; width:100%; min-width:0; padding:0 11px; font-size:14px;
  border:1px solid hsl(var(--input)); border-radius:calc(var(--radius) - 2px);
  background:hsl(var(--background)); box-shadow:var(--shadow-sm);
}
.champ::placeholder{color:hsl(var(--muted-foreground))}
.champ:focus-visible{outline:2px solid hsl(var(--ring)); outline-offset:1px; border-color:transparent}
select.champ{cursor:pointer; padding-right:8px}
textarea.champ{height:auto; padding:9px 11px; resize:vertical; min-height:88px; line-height:1.5; font-family:inherit}

.ajout{
  display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:22px;
  padding:12px; background:hsl(var(--card)); border:1px solid hsl(var(--border));
  border-radius:var(--radius); box-shadow:var(--shadow-sm);
}
.ajout .grand{flex:1 1 220px}
.ajout .petit{flex:0 1 140px}

/* ---------------------------------------------------------------- listes */
.groupe{margin-bottom:26px}
.groupe > h2{
  font-size:13px; font-weight:600; color:hsl(var(--muted-foreground));
  margin-bottom:9px; display:flex; align-items:center; gap:7px;
}
.groupe > h2 .n{
  font-family:"Geist Mono", ui-monospace, monospace; font-size:11px; font-weight:400;
  color:hsl(var(--muted-foreground)); border:1px solid hsl(var(--border));
  border-radius:5px; padding:0 5px; line-height:17px;
}
.groupe.urgent > h2{color:hsl(var(--destructive-fg))}

.pile{
  background:hsl(var(--card)); border:1px solid hsl(var(--border));
  border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm);
}
.ligne{
  display:flex; align-items:center; gap:12px; padding:9px 14px; min-height:48px;
  border-bottom:1px solid hsl(var(--border)); transition:background-color .1s;
}
.ligne:last-child{border-bottom:0}
.ligne:hover{background:hsl(var(--muted)/.45)}
.ligne .corps{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
.ligne .titre{overflow-wrap:anywhere; line-height:1.4}
.ligne.finie .titre{text-decoration:line-through; color:hsl(var(--muted-foreground))}
.ligne .meta{display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:12px; color:hsl(var(--muted-foreground))}
.ligne .actions{display:flex; gap:1px; opacity:0; transition:opacity .12s}
.ligne:hover .actions, .ligne:focus-within .actions{opacity:1}
@media (hover:none){.ligne .actions{opacity:1}}

input[type=checkbox]{
  appearance:none; width:16px; height:16px; flex:none; margin:0; cursor:pointer;
  border:1px solid hsl(var(--primary)/.5); border-radius:4px; background:hsl(var(--background));
  display:grid; place-items:center; box-shadow:var(--shadow-sm);
}
input[type=checkbox]:checked{background:hsl(var(--primary)); border-color:hsl(var(--primary))}
input[type=checkbox]:checked::after{
  content:""; width:8px; height:4px; border:1.8px solid hsl(var(--primary-foreground));
  border-top:0; border-right:0; transform:rotate(-45deg) translate(1px,-1px);
}

.puce{
  display:inline-flex; align-items:center; border-radius:9999px; padding:1px 9px;
  font-size:11px; font-weight:500; line-height:17px; white-space:nowrap;
  background:hsl(var(--secondary)); color:hsl(var(--secondary-foreground));
  border:1px solid transparent;
}
.puce.contour{background:transparent; border-color:hsl(var(--border)); color:hsl(var(--muted-foreground))}
.puce.rouille{background:hsl(var(--destructive)/.12); color:hsl(var(--destructive-fg))}
.puce.ocre{background:hsl(var(--warning)/.15); color:hsl(var(--warning))}

.vide{
  border:1px dashed hsl(var(--border)); border-radius:var(--radius); padding:34px 24px;
  text-align:center; color:hsl(var(--muted-foreground)); font-size:14px;
}
details.fini{margin-top:20px}
details.fini > summary{
  cursor:pointer; font-size:13px; color:hsl(var(--muted-foreground)); font-weight:500;
  padding:4px 0; list-style:none;
}
details.fini > summary::-webkit-details-marker{display:none}
details.fini > summary::before{content:"▸ "; color:hsl(var(--muted-foreground))}
details.fini[open] > summary::before{content:"▾ "}

/* -------------------------------------------------------------- recettes */
.duo{display:grid; grid-template-columns:280px minmax(0,1fr); gap:20px; align-items:start}
.carte-rec{
  display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; padding:10px 12px;
  background:hsl(var(--card)); border:1px solid hsl(var(--border));
  border-radius:calc(var(--radius) - 2px); box-shadow:var(--shadow-sm); transition:background-color .12s, border-color .12s;
}
.carte-rec:hover{background:hsl(var(--accent))}
.carte-rec[aria-current="true"]{border-color:hsl(var(--primary)/.55); background:hsl(var(--accent))}
.carte-rec b{font-size:14px; font-weight:600}
.fiche{
  background:hsl(var(--card)); border:1px solid hsl(var(--border));
  border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow-sm);
}
.fiche h2{font-size:20px}
.fiche .rangee{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0 22px}
.compteur{
  display:inline-flex; align-items:center; height:32px; border:1px solid hsl(var(--border));
  border-radius:calc(var(--radius) - 2px); overflow:hidden; background:hsl(var(--background)); box-shadow:var(--shadow-sm);
}
.compteur button{height:100%; padding:0 10px; border:0; background:none; color:hsl(var(--muted-foreground)); font-size:15px; line-height:1}
.compteur button:hover{background:hsl(var(--accent)); color:hsl(var(--accent-foreground))}
.compteur span{padding:0 8px; font-size:13px; font-weight:500; min-width:80px; text-align:center}
.ingr{list-style:none; margin:0; padding:0}
.ingr li{display:flex; align-items:baseline; gap:12px; padding:7px 0; border-bottom:1px solid hsl(var(--border))}
.ingr li:last-child{border-bottom:0}
.ingr .q{
  font-family:"Geist Mono", ui-monospace, monospace; font-size:13px; min-width:84px;
  color:hsl(var(--muted-foreground)); font-variant-numeric:tabular-nums;
}
.ingr .r{margin-left:auto; font-size:12px; color:hsl(var(--muted-foreground))}
.etapes{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:8px; color:hsl(var(--foreground))}
.etapes li{padding-left:4px}
.sous{font-size:13px; font-weight:600; color:hsl(var(--muted-foreground)); margin:24px 0 10px}

/* ----------------------------------------------------------------- menu */
.semaine{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:10px}
.jour{
  background:hsl(var(--card)); border:1px solid hsl(var(--border)); border-radius:var(--radius);
  padding:11px; min-height:120px; display:flex; flex-direction:column; gap:7px; box-shadow:var(--shadow-sm);
}
.jour.today{border-color:hsl(var(--primary)/.6)}
.jour > h3{font-size:12px; font-weight:600; color:hsl(var(--muted-foreground))}
.jour.today > h3{color:hsl(var(--foreground))}
.repas{
  background:hsl(var(--muted)/.6); border-radius:6px; padding:7px 8px;
  display:flex; gap:8px; align-items:flex-start; font-size:13px;
}
.repas .n{flex:1; min-width:0; overflow-wrap:anywhere; line-height:1.35}
.repas.fait .n{text-decoration:line-through; color:hsl(var(--muted-foreground))}
.repas .moment{display:block; font-size:11px; color:hsl(var(--muted-foreground)); font-weight:500}
.repas .btn-nu{width:22px; height:22px}
.repas .btn-nu svg{width:13px; height:13px}

/* --------------------------------------------------------------- courses */
.rayons{columns:2; column-gap:20px}
.rayons .groupe{break-inside:avoid; display:block}
.source{
  font-size:12px; color:hsl(var(--muted-foreground)); text-align:right;
  max-width:44%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* -------------------------------------------------------------- dialogue */
dialog{
  border:1px solid hsl(var(--border)); border-radius:var(--radius);
  background:hsl(var(--background)); color:hsl(var(--foreground));
  padding:0; box-shadow:var(--shadow-lg); width:min(600px, calc(100vw - 32px)); max-height:88vh;
}
dialog::backdrop{background:rgb(0 0 0 / .55)}
.dlg-tete{display:flex; align-items:center; gap:12px; padding:20px 22px 14px}
.dlg-tete h2{font-size:17px; flex:1}
.dlg-corps{padding:0 22px 4px; overflow:auto; max-height:64vh; display:flex; flex-direction:column; gap:16px}
.dlg-pied{display:flex; gap:8px; justify-content:flex-end; padding:20px 22px}
label.lab{display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:500}
label.lab > span:first-child{color:hsl(var(--foreground))}
.grille{display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:14px}
.ing-ligne{display:grid; grid-template-columns:68px 96px minmax(0,1fr) 138px 28px; gap:6px; align-items:center}

/* --------------------------------------------------------------- mobile */
@media (max-width:920px){ .duo{grid-template-columns:1fr} .rayons{columns:1} }
@media (max-width:760px){
  body{grid-template-columns:1fr}
  main{padding:20px 16px 96px}
  .rail{
    position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; z-index:40; flex-direction:row;
    align-items:center; gap:2px; padding:6px; border-right:0; border-top:1px solid hsl(var(--border));
  }
  .marque, .rail-pied{display:none}
  .rail nav{flex-direction:row; flex:1; justify-content:space-around}
  .onglet{position:relative; flex-direction:column; gap:3px; height:auto; padding:5px 4px; font-size:11px; text-align:center}
  .onglet .compte{position:absolute; margin:0; transform:translate(15px,-5px); font-size:10px; line-height:15px; min-width:15px}
  .ing-ligne{grid-template-columns:58px 78px minmax(0,1fr) 28px}
  .ing-ligne select.rayon{grid-column:1 / 4}
}
</style>

  <div class="marque"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M5 7l1.4 11.2A2 2 0 0 0 8.4 20h7.2a2 2 0 0 0 2-1.8L19 7"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg></span><b>Intendance</b></div>
  <nav id="nav"></nav>

</aside>

<main>

  <section class="vue" id="vue-achats" hidden></section>
  <section class="vue" id="vue-recettes" hidden></section>
  <section class="vue" id="vue-menu" hidden></section>
  <section class="vue" id="vue-courses" hidden></section>
</main>

<dialog id="dlg-recette"></dialog>
<dialog id="dlg-planif"></dialog>
<dialog id="dlg-reglages"></dialog>

 "rayons":{"pâtes":"Garde-manger","pesto":"Épicerie","parmesan":"Crèmerie","sel":"Garde-manger","blanc de poulet":"Boucherie","lait de coco":"Épicerie","oignon":"Fruits & légumes","ail":"Fruits & légumes","poivron rouge":"Fruits & légumes","curry en poudre":"Garde-manger","riz basmati":"Garde-manger","courgette":"Fruits & légumes","pomme de terre":"Fruits & légumes","bouillon de légumes":"Garde-manger","crème fraîche":"Crèmerie","lentilles vertes":"Garde-manger","feta":"Crèmerie","tomate":"Fruits & légumes","huile d'olive":"Garde-manger","moutarde":"Garde-manger"},
 "menu":[

<script>
(function(){
"use strict";

/* ============================================================ constantes */
const CLE_ETAT = "intendance:v1", CLE_ONGLET = "intendance:onglet", CLE_THEME = "intendance:theme";
const FICHIER = "data/etat.json";

const RAYONS = ["Fruits & légumes","Boucherie","Poissonnerie","Crèmerie","Boulangerie","Épicerie",
                "Surgelés","Boissons","Maison","Garde-manger","Divers"];
const JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const MOMENTS = ["Midi","Soir"];
const CATEGORIES = ["Entrée","Plat","Dessert","Petit-déjeuner"];
const PRIORITES = {haute:"Prioritaire", normale:"Normal", basse:"Un jour"};

const I = {
  taches:'<path d="M20 6 9 17l-5-5"/>',
  achats:'<path d="M20.6 13.4 12 22l-9-9V4h9l8.6 8.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.8" cy="7.8" r="1.3"/>',
  recettes:'<path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4Z"/><path d="M4 17a3 3 0 0 1 3-3h11"/>',
  menu:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>',
  courses:'<path d="M5 9h14l-1.4 10.3a2 2 0 0 1-2 1.7H8.4a2 2 0 0 1-2-1.7L5 9Z"/><path d="m9 9 3-6 3 6"/>',
  crayon:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  poubelle:'<path d="M3 6h18M8 6V4h8v2M18.5 6l-1 13.5H6.5L5.5 6"/>',
  lien:'<path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M20 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5"/>'
};
const ONGLETS = [
  {id:"taches",   nom:"Tâches"},
  {id:"achats",   nom:"Achats"},
  {id:"recettes", nom:"Recettes"},
  {id:"menu",     nom:"Semaine"},
  {id:"courses",  nom:"Courses"}
];

/* ================================================================ outils */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const svg = (d, cls) => '<svg class="' + (cls||"") + '" viewBox="0 0 24 24" aria-hidden="true">' + d + '</svg>';
const nb = (n) => String(Math.round(n * 100) / 100).replace(".", ",");
const euros = (n) => nb(n) + " €";
const jourISO = (d) => { const x = d || new Date(); return new Date(x.getTime() - x.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const dateCourte = (iso) => new Date(iso + "T12:00:00")
  .toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"});
const rayonDe = (nom) => etat.rayons[String(nom).toLowerCase().trim()] || "Divers";
const rangRayon = (r) => { const i = RAYONS.indexOf(r); return i < 0 ? 99 : i; };
const optionsRayon = (sel) => RAYONS.map(r =>
  '<option value="' + esc(r) + '"' + (r === sel ? " selected" : "") + '>' + esc(r) + '</option>').join("");

/* ================================================================= état */
const base = JSON.parse($("#etat").textContent);
function normaliser(e){
  e = e && typeof e === "object" ? e : {};
  e.v = 1;
  e.maj = Number(e.maj) || 0;
  e.graine = Number(e.graine) || 0;
  for (const c of ["taches","achats","recettes","menu","extras"]) if (!Array.isArray(e[c])) e[c] = [];
  for (const c of ["rayons","coches"]) if (!e[c] || typeof e[c] !== "object") e[c] = {};
  e.recettes.forEach(r => { if (!Array.isArray(r.ingredients)) r.ingredients = [];
                            if (!Array.isArray(r.etapes)) r.etapes = []; });
  return e;
}
let etat = normaliser(base);
try {
  const brut = localStorage.getItem(CLE_ETAT);
  if (brut) { const p = JSON.parse(brut); if (p && (p.maj || 0) >= etat.maj) etat = normaliser(p); }
} catch (e) {}

// Une graine plus récente que celle déjà vue apporte ses nouveautés sans écraser le reste.
function appliquerGraine(){
  const vue = etat.graine, dispo = Number(base.graine) || 0;
  if (vue >= dispo) return false;
  const retirer = new Set(base.retirer || []);
  for (const col of ["taches","achats","recettes"]) {
    etat[col] = etat[col].filter(x => !retirer.has(x.id));
    const connus = new Set(etat[col].map(x => x.id));
    for (const item of (base[col] || [])) if (!connus.has(item.id)) etat[col].push(item);
  }
  for (const cle in (base.rayons || {})) if (!(cle in etat.rayons)) etat.rayons[cle] = base.rayons[cle];
  etat.graine = dispo;
  return true;
}
let graineNeuve = appliquerGraine();
if (graineNeuve) { etat.maj = Date.now(); }

let onglet = "taches";
try { const o = localStorage.getItem(CLE_ONGLET); if (ONGLETS.some(x => x.id === o)) onglet = o; } catch (e) {}
try { const t = localStorage.getItem(CLE_THEME); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}

let recetteVue = etat.recettes.length ? etat.recettes[0].id : null;
let portionsVue = null;
let edition = null;
let focusCible = null;
let touche = false;

/* ========================================================= persistance */
let api = null, minuteur = null;
const chip = $("#sauv");
function statut(mode, texte){ chip.dataset.etat = mode; chip.lastElementChild.textContent = texte; }

function sauverLocal(){
  try { localStorage.setItem(CLE_ETAT, JSON.stringify(etat)); } catch (e) {}
}
function modifier(fn){
  fn(etat);
  etat.maj = Date.now();
  touche = true;
  sauverLocal();
  clearTimeout(minuteur);
  if (api) { statut("cours", "Enregistrement…"); minuteur = setTimeout(pousser, 1500); }
  else statut("local", "Gardé sur cet appareil");
  rendre();
}
async function pousser(){
  if (!api) return;
  try {
    await api.publish({ "data/etat.json": JSON.stringify(etat) });
    statut("ok", "Enregistré");
  } catch (err) {
    const code = err && err.code;
    if (code === "conflict") { statut("ok", "Enregistré"); return; }
    if (code === "rate_limited") { clearTimeout(minuteur); minuteur = setTimeout(pousser, 6000); return; }
    api = null;
    statut("local", "Gardé sur cet appareil");
  }
}
(async function(){
  try { if (window.claude && window.claude.use) api = await window.claude.use("artifact"); } catch (e) {}
  statut(api ? "ok" : "local", api ? "Enregistré" : "Gardé sur cet appareil");
  if (!api) { if (graineNeuve) sauverLocal(); return; }
  try {
    const rep = await fetch(FICHIER, {cache:"no-store"});
    if (!rep.ok) return;
    const dist = normaliser(await rep.json());
    if (!touche && dist.maj > etat.maj) {
      etat = dist;
      if (appliquerGraine()) { etat.maj = Date.now(); graineNeuve = true; }
      rendre();
    }
  } catch (e) {}
  if (graineNeuve) { touche = true; sauverLocal(); clearTimeout(minuteur); minuteur = setTimeout(pousser, 1500); }
})();

/* ============================================================ rendu nav */
function compteurs(){
  return {
    taches: etat.taches.filter(t => !t.fait).length,
    achats: etat.achats.filter(a => !a.fait).length,
    recettes: etat.recettes.length,
    menu: etat.menu.filter(m => !m.fait).length,
    courses: articlesCourses().filter(a => !a.coche).length
  };
}
function rendreNav(){
  const c = compteurs();
  $("#nav").innerHTML = ONGLETS.map(o =>
    '<button class="onglet" data-onglet="' + o.id + '" aria-current="' + (o.id === onglet) + '">' +
      svg(I[o.id]) + '<span>' + o.nom + '</span>' +
      (c[o.id] ? '<span class="compte">' + c[o.id] + '</span>' : '') +
    '</button>').join("");
}

/* ============================================================== TÂCHES */
function groupeEcheance(t){
  if (!t.echeance) return "sansdate";
  const a = jourISO();
  if (t.echeance < a) return "retard";
  if (t.echeance === a) return "auj";
  const d = new Date(); d.setDate(d.getDate() + 7);
  return t.echeance <= jourISO(d) ? "semaine" : "tard";
}
const LIB_GROUPE = {retard:"En retard", auj:"Aujourd'hui", semaine:"Dans la semaine", tard:"Plus tard", sansdate:"Sans échéance"};

function ligneTache(t){
  if (edition && edition.type === "tache" && edition.id === t.id) {
    return '<form class="ligne" data-form="tache-edit" data-id="' + t.id + '">' +
      '<input class="champ" name="texte" value="' + esc(t.texte) + '" autofocus>' +
      '<input class="champ" name="contexte" style="flex:0 1 120px" placeholder="contexte" value="' + esc(t.contexte || "") + '" list="contextes">' +
      '<input class="champ" name="echeance" type="date" style="flex:0 1 150px" value="' + esc(t.echeance || "") + '">' +
      '<button class="btn btn-plein" type="submit">OK</button>' +
      '<button class="btn" type="button" data-a="annuler">Annuler</button></form>';
  }
  const g = groupeEcheance(t);
  return '<div class="ligne' + (t.fait ? " finie" : "") + '">' +
    '<input type="checkbox" data-a="tache-fait" data-id="' + t.id + '"' + (t.fait ? " checked" : "") +
      ' aria-label="Terminer ' + esc(t.texte) + '">' +
    '<div class="corps"><span class="titre">' + esc(t.texte) + '</span>' +
      (t.contexte || t.echeance ? '<span class="meta">' +
        (t.contexte ? '<span class="puce">' + esc(t.contexte) + '</span>' : '') +
        (t.echeance ? '<span class="puce' + (g === "retard" ? " rouille" : g === "auj" ? " ocre" : " contour") + '">' +
          esc(dateCourte(t.echeance)) + '</span>' : '') + '</span>' : '') +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn-nu" data-a="tache-edit" data-id="' + t.id + '" title="Modifier">' + svg(I.crayon) + '</button>' +
      '<button class="btn-nu danger" data-a="tache-suppr" data-id="' + t.id + '" title="Supprimer">' + svg(I.poubelle) + '</button>' +
    '</div></div>';
}

function vueTaches(){
  const actives = etat.taches.filter(t => !t.fait);
  const finies  = etat.taches.filter(t => t.fait);
  const contextes = [...new Set(etat.taches.map(t => t.contexte).filter(Boolean))];
  let corps = "";
  for (const g of ["retard","auj","semaine","tard","sansdate"]) {
    const lot = actives.filter(t => groupeEcheance(t) === g);
    if (!lot.length) continue;
    corps += '<div class="groupe' + (g === "retard" ? " urgent" : "") + '"><h2>' + LIB_GROUPE[g] +
      '<span class="n">' + lot.length + '</span></h2><div class="pile">' + lot.map(ligneTache).join("") + '</div></div>';
  }
  if (!actives.length) corps = '<p class="vide">Rien à faire. Ajoute une tâche ci-dessus.</p>';

  return '<div class="tete"><div><h1>Tâches</h1>' +
      '<p>' + (actives.length ? actives.length + (actives.length > 1 ? " en cours" : " en cours") : "Tout est fait") + '</p></div></div>' +
    '<form class="ajout" data-form="tache-ajout">' +
      '<input class="champ grand" name="texte" placeholder="Que faut-il faire&nbsp;?" required autocomplete="off">' +
      '<input class="champ petit" name="contexte" placeholder="Contexte" list="contextes" autocomplete="off">' +
      '<input class="champ petit" name="echeance" type="date" aria-label="Échéance">' +
      '<button class="btn btn-plein" type="submit">Ajouter</button>' +
    '</form>' +
    '<datalist id="contextes">' + contextes.map(c => '<option value="' + esc(c) + '"></option>').join("") + '</datalist>' +
    corps +
    (finies.length ? '<details class="fini"><summary>' + finies.length + ' terminée' + (finies.length > 1 ? "s" : "") +
      '</summary><div class="pile" style="margin-top:8px">' + finies.map(ligneTache).join("") + '</div>' +
      '<button class="btn" style="margin-top:10px" data-a="taches-purge">Effacer les tâches terminées</button></details>' : "");
}

/* ============================================================== ACHATS */
function ligneAchat(a){
  if (edition && edition.type === "achat" && edition.id === a.id) {
    return '<form class="ligne" data-form="achat-edit" data-id="' + a.id + '">' +
      '<input class="champ" name="texte" value="' + esc(a.texte) + '" autofocus>' +
      '<input class="champ" name="categorie" style="flex:0 1 120px" placeholder="Catégorie" list="categories" value="' + esc(a.categorie || "") + '">' +
      '<input class="champ" name="lien" type="url" style="flex:0 1 170px" placeholder="https://" value="' + esc(a.lien || "") + '">' +
      '<input class="champ mono" name="prix" style="flex:0 1 90px" inputmode="decimal" placeholder="€" value="' + (a.prix == null ? "" : a.prix) + '">' +
      '<select class="champ" name="priorite" style="flex:0 1 130px">' +
        Object.keys(PRIORITES).map(p => '<option value="' + p + '"' + (a.priorite === p ? " selected" : "") + '>' + PRIORITES[p] + '</option>').join("") +
      '</select>' +
      '<button class="btn btn-plein" type="submit">OK</button>' +
      '<button class="btn" type="button" data-a="annuler">Annuler</button></form>';
  }
  return '<div class="ligne' + (a.fait ? " finie" : "") + '">' +
    '<input type="checkbox" data-a="achat-fait" data-id="' + a.id + '"' + (a.fait ? " checked" : "") +
      ' aria-label="Marquer ' + esc(a.texte) + ' comme acheté">' +
    '<div class="corps"><span class="titre">' + esc(a.texte) + '</span>' +
      '<span class="meta">' +
        (a.priorite && a.priorite !== "normale" ? '<span class="puce' + (a.priorite === "haute" ? " rouille" : "") + '">' + PRIORITES[a.priorite] + '</span>' : '') +
        (a.lien ? '<a href="' + esc(a.lien) + '" target="_blank" rel="noopener noreferrer">Voir la référence</a>' : '') +
      '</span>' +
    '</div>' +
    (a.prix != null && a.prix !== "" ? '<span class="mono" style="font-size:13px">' + euros(Number(a.prix)) + '</span>' : '') +
    '<div class="actions">' +
      '<button class="btn-nu" data-a="achat-edit" data-id="' + a.id + '" title="Modifier">' + svg(I.crayon) + '</button>' +
      '<button class="btn-nu danger" data-a="achat-suppr" data-id="' + a.id + '" title="Supprimer">' + svg(I.poubelle) + '</button>' +
    '</div></div>';
}

function vueAchats(){
  const rang = {haute:0, normale:1, basse:2};
  const actifs = etat.achats.filter(a => !a.fait);
  const faits  = etat.achats.filter(a => a.fait);
  const total  = actifs.reduce((s, a) => s + (Number(a.prix) || 0), 0);
  const cats = [...new Set(etat.achats.map(a => (a.categorie || "").trim()))];
  const ordre = [...new Set(actifs.map(a => (a.categorie || "").trim()))]
    .sort((x, y) => (x === "" ? 1 : 0) - (y === "" ? 1 : 0) || x.localeCompare(y, "fr"));
  const trier = (l) => l.slice().sort((x, y) => (rang[x.priorite] ?? 1) - (rang[y.priorite] ?? 1)
    || x.texte.localeCompare(y.texte, "fr"));
  const corps = (ordre.length === 1 && ordre[0] === "")
    ? '<div class="pile">' + trier(actifs).map(ligneAchat).join("") + '</div>'
    : ordre.map(c => {
        const lot = trier(actifs.filter(a => (a.categorie || "").trim() === c));
        return '<div class="groupe"><h2>' + esc(c || "Sans catégorie") + '<span class="n">' + lot.length +
          '</span></h2><div class="pile">' + lot.map(ligneAchat).join("") + '</div></div>';
      }).join("");

  return '<div class="tete"><div><h1>Achats</h1>' +
      '<p>' + (actifs.length ? actifs.length + " article" + (actifs.length > 1 ? "s" : "") +
        (total ? " · " + euros(total) + " au total" : "") : "Liste vide") + '</p></div></div>' +
    '<form class="ajout" data-form="achat-ajout">' +
      '<input class="champ grand" name="texte" placeholder="Quoi acheter&nbsp;?" required autocomplete="off">' +
      '<input class="champ petit" name="categorie" placeholder="Catégorie" list="categories" autocomplete="off">' +

/* ============================================================= COURSES */
function articlesCourses(){
  const acc = new Map();
  for (const m of etat.menu) {
    if (m.fait) continue;
    const r = etat.recettes.find(x => x.id === m.recetteId);
    if (!r) continue;
    const f = (Number(m.portions) || r.portions || 1) / (r.portions || 1);
    for (const ing of r.ingredients) {
      if (!ing.nom) continue;
      const u = (ing.unite || "").trim();
      const cle = ing.nom.toLowerCase().trim() + "|" + u.toLowerCase();
      let e = acc.get(cle);
      if (!e) { e = {cle, nom:ing.nom, unite:u, qte:0, chiffree:false, rayon:rayonDe(ing.nom), sources:new Set(), extra:false}; acc.set(cle, e); }
      if (ing.qte != null && ing.qte !== "") { e.qte += Number(ing.qte) * f; e.chiffree = true; }
      e.sources.add(r.nom);
    }
  }
  const out = [...acc.values()].map(e => ({...e, sources:[...e.sources], coche: !!etat.coches[e.cle]}));
  for (const x of etat.extras)
    out.push({cle:"extra:" + x.id, id:x.id, nom:x.texte, unite:"", qte:0, chiffree:false,
              rayon:x.rayon || "Divers", sources:[], extra:true, coche:!!x.fait});
  return out;
}
function libelleQte(a){
  if (!a.chiffree) return a.unite || "";
  // sans unité, l'article se compte à la pièce : on arrondit au supérieur, on n'achète pas 3,5 oignons
  return a.unite ? nb(a.qte) + " " + a.unite : nb(Math.ceil(a.qte));
}

function vueCourses(){
  const arts = articlesCourses();
  const restants = arts.filter(a => !a.coche).length;
  const parRayon = new Map();
  for (const a of arts) { if (!parRayon.has(a.rayon)) parRayon.set(a.rayon, []); parRayon.get(a.rayon).push(a); }
  const groupes = [...parRayon.entries()]
    .sort((x, y) => rangRayon(x[0]) - rangRayon(y[0]))
    .map(([rayon, lot]) => {
      lot.sort((a, b) => Number(a.coche) - Number(b.coche) || a.nom.localeCompare(b.nom, "fr"));
      return '<div class="groupe"><h2>' + esc(rayon) + '<span class="n">' + lot.length + '</span></h2><div class="pile">' +
        lot.map(a =>
          '<div class="ligne' + (a.coche ? " finie" : "") + '">' +
            '<input type="checkbox" data-a="course-coche" data-cle="' + esc(a.cle) + '"' + (a.coche ? " checked" : "") +
              ' aria-label="' + esc(a.nom) + '">' +
            '<div class="corps"><span class="titre">' + esc(a.nom) +
              (libelleQte(a) ? ' <span class="mono" style="color:hsl(var(--muted-foreground)); font-size:13px">' + esc(libelleQte(a)) + '</span>' : '') +
            '</span>' +
            '</div>' +
            (a.sources.length ? '<span class="source">' + esc(a.sources.join(" · ")) + '</span>' : '') +
            (a.extra ? '<div class="actions"><button class="btn-nu danger" data-a="extra-suppr" data-id="' + a.id +
                       '" title="Retirer">' + svg(I.poubelle) + '</button></div>' : '') +
          '</div>').join("") +
      '</div></div>';
    }).join("");

  return '<div class="tete"><div><h1>Courses</h1>' +
      '<p>' + (arts.length ? restants + " article" + (restants > 1 ? "s" : "") + " à prendre · calculé depuis la semaine"
                           : "Planifie des repas dans Semaine, la liste se remplit toute seule") + '</p></div>' +
      (arts.length ? '<div class="droite"><button class="btn" data-a="courses-decocher">Tout décocher</button></div>' : '') +
    '</div>' +
    '<form class="ajout" data-form="extra-ajout">' +
      '<input class="champ grand" name="texte" placeholder="Ajouter hors recette (papier toilette, café…)" required autocomplete="off">' +
      '<select class="champ" name="rayon" style="flex:0 1 170px">' + optionsRayon("Maison") + '</select>' +
      '<button class="btn btn-plein" type="submit">Ajouter</button>' +
    '</form>' +
    (arts.length ? '<div class="rayons">' + groupes + '</div>'
                 : '<p class="vide">Rien à acheter : aucun repas planifié et aucun extra.</p>');
}

function msgReglages(t, err){
  const n = $("#msg-reglages");
  if (n) { n.textContent = t; n.style.color = err ? "hsl(var(--destructive-fg))" : "hsl(var(--muted-foreground))"; }

async function exporter(){
  const data = JSON.stringify(etat, null, 2);
  const nom = "intendance-" + jourISO() + ".json";
  try {
    const dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({filename: nom, data}); msgReglages("Fichier enregistré."); return; }
  } catch (err) {
    if (err && err.code === "declined") { msgReglages("Export annulé."); return; }
  }
  try { await navigator.clipboard.writeText(data); msgReglages("Téléchargement indisponible ici — données copiées dans le presse-papiers."); }
  catch (e) { msgReglages("Export impossible dans ce contexte.", true); }
}

function importer(fichier){
  const lecteur = new FileReader();
  lecteur.onload = () => {
    try {
      const objet = JSON.parse(String(lecteur.result));
      if (!objet || typeof objet !== "object" || !Array.isArray(objet.taches))
        throw new Error("Ce fichier n'est pas un export Intendance.");
      modifier(e => {
        const n = normaliser(objet);
        e.taches = n.taches; e.achats = n.achats; e.recettes = n.recettes;
        e.rayons = n.rayons; e.menu = n.menu; e.extras = n.extras; e.coches = n.coches;
      });
      msgReglages("Données importées.");
    } catch (err) { msgReglages(err.message || "Fichier illisible.", true); }
  };
  lecteur.onerror = () => msgReglages("Lecture du fichier impossible.", true);
  lecteur.readAsText(fichier);
}

document.addEventListener("click", (ev) => {
  const nav = ev.target.closest("[data-onglet]");
  if (nav) {
    onglet = nav.dataset.onglet;
    try { localStorage.setItem(CLE_ONGLET, onglet); } catch (e) {}
    edition = null; rendre();
    return;
  }
  const el = ev.target.closest("[data-a]");
  if (!el) {
    const d = ev.target.closest("dialog");
    if (d && ev.target === d) d.close();
    return;
  }
  const a = el.dataset.a, id = el.dataset.id;

  if (a === "fermer") { el.closest("dialog").close(); return; }
  if (a === "annuler") { edition = null; rendre(); return; }

  switch (a) {
    /* tâches */
    case "tache-fait":   modifier(e => { const t = e.taches.find(x => x.id === id); if (t) t.fait = !t.fait; }); break;
    case "tache-edit":   edition = {type:"tache", id}; rendre(); break;
    case "tache-suppr":  modifier(e => { e.taches = e.taches.filter(x => x.id !== id); }); break;
    case "taches-purge": modifier(e => { e.taches = e.taches.filter(x => !x.fait); }); break;
    /* achats */
    case "achat-fait":   modifier(e => { const x = e.achats.find(y => y.id === id); if (x) x.fait = !x.fait; }); break;
    case "achat-edit":   edition = {type:"achat", id}; rendre(); break;
    case "achat-suppr":  modifier(e => { e.achats = e.achats.filter(x => x.id !== id); }); break;
    case "achats-purge": modifier(e => { e.achats = e.achats.filter(x => !x.fait); }); break;
    /* recettes */
    case "recette-voir": recetteVue = id; portionsVue = null; rendre(); break;
    case "recette-neuve": ouvrirRecette(null); break;
    case "recette-edit": ouvrirRecette(id); break;
    case "recette-suppr": {
      const r = etat.recettes.find(x => x.id === id);
      if (!r || !confirm('Supprimer « ' + r.nom + ' » ? Les repas planifiés avec cette recette seront retirés.')) break;
      modifier(e => {
        e.recettes = e.recettes.filter(x => x.id !== id);
        e.menu = e.menu.filter(m => m.recetteId !== id);
      });
      recetteVue = etat.recettes.length ? etat.recettes[0].id : null;
      rendre();
      break;
    }
    case "portions-moins": {
      const r = etat.recettes.find(x => x.id === recetteVue);
      portionsVue = Math.max(1, (portionsVue || (r ? r.portions : 2)) - 1); rendre(); break;
    }
    case "portions-plus": {
      const r = etat.recettes.find(x => x.id === recetteVue);
      portionsVue = Math.min(50, (portionsVue || (r ? r.portions : 2)) + 1); rendre(); break;
    }
    case "planifier": ouvrirPlanif(id); break;
    /* semaine */
    case "repas-fait":  modifier(e => { const m = e.menu.find(x => x.id === id); if (m) m.fait = !m.fait; }); break;
    case "repas-suppr": modifier(e => { e.menu = e.menu.filter(x => x.id !== id); }); break;
    case "menu-vider":
      if (confirm("Retirer tous les repas de la semaine ?")) modifier(e => { e.menu = []; });
      break;
    /* courses */
    case "course-coche": {
      const cle = el.dataset.cle;
      if (cle.startsWith("extra:")) {
        const eid = cle.slice(6);
        modifier(e => { const x = e.extras.find(y => y.id === eid); if (x) x.fait = !x.fait; });
      } else {
        modifier(e => { if (e.coches[cle]) delete e.coches[cle]; else e.coches[cle] = true; });
      }
      break;
    }
    case "extra-suppr": modifier(e => { e.extras = e.extras.filter(x => x.id !== id); }); break;
    case "courses-decocher":
      modifier(e => { e.coches = {}; e.extras.forEach(x => { x.fait = false; }); });
      break;
    /* formulaire recette */
    case "ing-plus": {
      const liste = $("#ing-liste");
      liste.insertAdjacentHTML("beforeend", ligneIngForm());
      $('.ing-ligne:last-child [name="nom"]', liste).focus();
      break;
    }
    case "ing-suppr": {
      const liste = $("#ing-liste");
      if (liste.children.length > 1) el.closest(".ing-ligne").remove();
      else liste.innerHTML = ligneIngForm();
      break;
    }
    /* réglages */
    case "reglages": ouvrirReglages(); break;
    case "exporter": exporter(); break;
    case "importer": $("#fichier-import").click(); break;
    case "tout-effacer":
      if (!confirm("Effacer tâches, achats, recettes, semaine et courses ? C'est définitif.")) break;
      modifier(e => { e.taches = []; e.achats = []; e.recettes = []; e.menu = []; e.extras = []; e.coches = {}; e.rayons = {}; });
      recetteVue = null;
      msgReglages("Tout est effacé.");
      break;
  }
});

document.addEventListener("change", (ev) => {
  if (ev.target.matches('[data-a="theme"]')) {
    const v = ev.target.value;
    if (v === "systeme") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", v);
    try { localStorage.setItem(CLE_THEME, v); } catch (e) {}
    return;
  }
  if (ev.target.id === "fichier-import" && ev.target.files && ev.target.files[0]) {
    importer(ev.target.files[0]);
    ev.target.value = "";
  }
});

document.addEventListener("submit", (ev) => {
  const f = ev.target.closest("[data-form]");
  if (!f) return;
  ev.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  const id = f.dataset.id;

  switch (f.dataset.form) {
    case "tache-ajout":
      if (!String(d.texte).trim()) return;
      modifier(e => e.taches.unshift({id:uid(), texte:String(d.texte).trim(),
        contexte:String(d.contexte || "").trim(), echeance:d.echeance || "", fait:false}));
      focusCible = '[data-form="tache-ajout"] [name="texte"]';
      rendre();
      break;
    case "tache-edit":
      modifier(e => { const t = e.taches.find(x => x.id === id); if (!t) return;
        t.texte = String(d.texte).trim() || t.texte;
        t.contexte = String(d.contexte || "").trim();
        t.echeance = d.echeance || ""; });
      edition = null; rendre();
      break;

    case "achat-ajout":
      if (!String(d.texte).trim()) return;
      modifier(e => e.achats.unshift({id:uid(), texte:String(d.texte).trim(), categorie:String(d.categorie || "").trim(),
        lien:String(d.lien || "").trim(),
        prix: d.prix === "" ? null : Number(String(d.prix).replace(",", ".")), priorite:d.priorite || "normale", fait:false}));
      focusCible = '[data-form="achat-ajout"] [name="texte"]';
      rendre();
      break;
    case "achat-edit":
      modifier(e => { const x = e.achats.find(y => y.id === id); if (!x) return;
        x.texte = String(d.texte).trim() || x.texte;
        x.categorie = String(d.categorie || "").trim();
        x.lien = String(d.lien || "").trim();
        x.prix = d.prix === "" ? null : Number(String(d.prix).replace(",", "."));
        x.priorite = d.priorite; });
      edition = null; rendre();
      break;

    case "recette-sauver": {
      const lignes = $$(".ing-ligne", f).map(l => ({
        qte:   $('[name="qte"]', l).value.trim(),
        unite: $('[name="unite"]', l).value.trim(),
        nom:   $('[name="nom"]', l).value.trim(),
        rayon: $('[name="rayon"]', l).value
      })).filter(x => x.nom);
      const recette = {
        id: id || uid(),
        nom: String(d.titre).trim(),
        portions: Math.max(1, Number(d.portions) || 1),
        temps: Number(d.temps) || null,
        categorie: d.categorie,
        notes: String(d.notes || "").trim(),
        ingredients: lignes.map(x => ({nom:x.nom, qte: x.qte === "" ? null : Number(x.qte.replace(",", ".")), unite:x.unite})),
        etapes: String(d.etapes || "").split("\n").map(s => s.trim()).filter(Boolean)
      };
      modifier(e => {
        for (const x of lignes) e.rayons[x.nom.toLowerCase()] = x.rayon;
        const i = e.recettes.findIndex(r => r.id === recette.id);
        if (i >= 0) e.recettes[i] = recette; else e.recettes.push(recette);
      });
      recetteVue = recette.id; portionsVue = null;
      f.closest("dialog").close();
      rendre();
      break;
    }

    case "planif":
      modifier(e => e.menu.push({id:uid(), jour:Number(d.jour), moment:d.moment,
        recetteId:id, portions:Math.max(1, Number(d.portions) || 1), fait:false}));
      f.closest("dialog").close();
      break;

    case "menu-ajout":
      if (!d.recetteId) return;
      modifier(e => e.menu.push({id:uid(), jour:Number(d.jour), moment:d.moment,
        recetteId:d.recetteId, portions:Math.max(1, Number(d.portions) || 1), fait:false}));
      break;

    case "extra-ajout":
      if (!String(d.texte).trim()) return;
      modifier(e => e.extras.push({id:uid(), texte:String(d.texte).trim(), rayon:d.rayon, fait:false}));
      focusCible = '[data-form="extra-ajout"] [name="texte"]';
      rendre();
      break;
  }
});

rendre();
})();
</script>
